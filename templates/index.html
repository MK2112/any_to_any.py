<!DOCTYPE html>
<html lang="{{ lang_code[:2] }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>any_to_any.py {{ title.split(' ')[1] }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</head>
<body>
    <header>
        <h1>
            <a class="static-anchor" target="_blank" href="https://github.com/MK2112/any_to_any.py">{{ title.split(" ")[0] }}</a>
            <p>Web</p>
            <a class="github-btn" href="https://github.com/MK2112/any_to_any.py"
               title="Star any_to_any.py on GitHub" target="_blank" rel="noopener noreferrer"
               aria-label="Star any_to_any.py on GitHub">
                <svg width="15" height="15" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <polygon points="12 2 15.1 8.4 22 9.3 17 14.2
                    18.2 21 12 17.7 5.8 21 7 14.2 2 9.3 8.9 8.4 12 2"/>
                </svg>
                <span>Star</span>
            </a>
            <a class="github-btn" href="https://github.com/MK2112/any_to_any.py"
               title="Fork any_to_any.py on GitHub" target="_blank" rel="noopener noreferrer"
               aria-label="Fork any_to_any.py on GitHub">
                <svg width="15" height="15" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <circle cx="6" cy="3" r="2"/>
                    <circle cx="18" cy="6" r="2"/>
                    <circle cx="6" cy="21" r="2"/>
                    <path d="M6 5v14"/>
                    <path d="M18 8a6 6 0 0 1-6 6H9"/>
                </svg>
                <span>Fork</span>
            </a>
        </h1>
    </header>
    <div class="fade-in">
        <main>
            <noscript>
                <div class="no-script">
                {% if lang_code == "ar_SA" %}
                    <p>{{ translations['js_warn_intro'].replace("[object]", title.split(' ')[0]) }}</p>
                {% else %}
                    <p><code>{{ title.split(' ')[0] }} Web</code> {{ translations['js_warn_intro'] }}</p>
                {% endif %}
                    <p>{{ translations['js_warn_outro'] }}</p>
                </div>
            </noscript>
            <form id="conversion-form" method="post" enctype="multipart/form-data">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div id="drop-area" ondrop="drop(event)" ondragover="allowDrop(event)" onclick="triggerUploadDialogue(event)">
                    <p>{{ translations['drag_drop_hint'] }}</p>
                    <input type="file" name="files" id="files" multiple onchange="handleFiles(this.files, true)">
                    <ul id="file-list"></ul>
                </div>
                <div id="conversion-options">
                    <label for="conversion-type">{{ translations['convert_to'] }}:</label>
                    <select id="conversion-type">
                        <optgroup label="{{ translations['resize_only'] }}">
                            <option value="original">{{ translations['resolution_original'] }}</option>
                        </optgroup>
                        {% for group in options %}
                        <optgroup label="{{ group.label }}">
                            {% for fmt in group.formats %}
                            <option value="{{ fmt }}"{% if fmt == "mp3" %} selected{% endif %}>{{ fmt }}</option>
                            {% endfor %}
                        </optgroup>
                        {% endfor %}
                    </select>
                    <label style="margin-left: 2px;" id="conversion-resolution-label" for="conversion-resolution" title="{{ translations['resolution_help'] }}" hidden>{{ translations['resolution_label'] }}:</label>
                    <select id="conversion-resolution" title="{{ translations['resolution_help'] }}" hidden></select>
                    <select id="metadata-mode" title="{{ translations['preserve_meta'] }} / {{ translations['strip_meta'] }}">
                        <option value="preserve" selected>{{ translations['metadata_mode_preserve'] }}</option>
                        <option value="none">{{ translations['metadata_mode_none'] }}</option>
                        <option value="strip">{{ translations['metadata_mode_strip'] }}</option>
                    </select>
                    <button title="{{ translations['convert_web_help'] }}" type="button" onclick="submitForm('/convert')">{{ translations['convert'] }}</button>
                    <button title="{{ translations['merge_web_help'] }}" type="button" onclick="submitForm('/merge')">{{ translations['merge'] }}</button>
                    <button title="{{ translations['concatenate_web_help'] }}" type="button" onclick="submitForm('/concat')">{{ translations['concatenate'] }}</button>
                </div>
                <script type="application/json" id="resolution-data">{{ resolution_data | tojson }}</script>
            </form>
            <div id="progress-container" style="display: none; margin-top: 1em;">
                <div id="progress-bar" style="height: 24px; width: 0; background: #5cb050; transition: width 0.3s;"></div>
                <span id="progress-status" role="status" aria-live="polite"></span>
                <button id="cancel-job" type="button" data-cancelling="{{ translations['cancelling'] }}" hidden>{{ translations['cancel'] }}</button>
            </div>
            <div id="error-message" style="display: none; color: #f44336; margin-top: 1em;"></div>
            <input type="hidden" id="job-id" name="job-id" value="">
        </main>
    </div>
    <div class="loader" id="loader"></div>
</body>
</html>
